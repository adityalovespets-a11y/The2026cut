<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aditya — Live Cut Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--mut:#898781;
  --grid:#e1e0d9;--baseline:#c3c2b7;--ring:rgba(11,11,11,.10);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--good:#006300;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --page:#0d0d0d;--surface:#1a1a19;--ink:#ffffff;--ink2:#c3c2b7;--mut:#898781;
  --grid:#2c2c2a;--baseline:#383835;--ring:rgba(255,255,255,.10);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--good:#0ca30c;
}}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--page);margin:0 auto;padding:28px clamp(16px,3vw,40px);max-width:1440px}
h1{font-size:22px;font-weight:600;margin:0 0 2px}
.sub{color:var(--ink2);font-size:13px;margin:0}
.top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:16px}
button{font:inherit;font-size:13px;border:1px solid var(--ring);background:var(--surface);border-radius:8px;padding:6px 14px;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--baseline)}
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.filters .lbl{font-size:12px;color:var(--mut);margin-right:2px}
.chip{padding:6px 12px;border-radius:8px;font-size:13px}
.chip.on{background:var(--ink);color:var(--page);border-color:var(--ink)}
.filters .sep{width:1px;height:22px;background:var(--grid);margin:0 6px}
.filters input[type=date]{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:5px 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:16px 18px}
.kpi .l{font-size:12px;color:var(--ink2);margin-bottom:4px}
.kpi .v{font-size:27px;font-weight:600;letter-spacing:-.01em}
.kpi .d{font-size:12px;color:var(--mut);margin-top:3px}
.kpi .d.g{color:var(--good)}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:20px 22px;margin-bottom:20px}
.card h2{font-size:15px;font-weight:600;margin:0 0 10px}
.note{font-size:12px;color:var(--mut);margin:8px 0 0}
.wrap{position:relative;height:440px}
.wrap.short{height:340px}
@media (max-width:640px){.wrap{height:300px}.wrap.short{height:260px}}
.leg{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-bottom:10px}
.leg span{display:flex;align-items:center;gap:6px}
.sw{width:16px;height:3px;border-radius:2px;display:inline-block}
.sw.dash{background:repeating-linear-gradient(90deg,var(--c,var(--baseline)) 0 4px,transparent 4px 7px)!important}
.sw.band{width:14px;height:12px;border-radius:3px;opacity:.25}
#err{color:#d03b3b;font-size:14px;padding:12px;background:color-mix(in srgb,#d03b3b 8%,var(--surface));border-radius:8px;display:none;margin-bottom:16px}
details{margin:4px 0 24px}
summary{font-size:13px;color:var(--ink2);cursor:pointer;padding:6px 2px}
table{border-collapse:collapse;width:100%;font-size:13px;background:var(--surface);border:1px solid var(--ring);border-radius:12px;overflow:hidden}
th,td{text-align:right;padding:7px 12px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--ink2);font-weight:500;font-size:12px}
tr:last-child td{border-bottom:none}
</style></head><body>
<div class="top">
 <div><h1>Cut Dashboard</h1><p class="sub" id="stamp">Loading live data…</p></div>
 <button onclick="load()">↻ Refresh</button>
</div>
<div id="err"></div>
<div class="filters" id="filters">
 <span class="lbl">Range</span>
 <button class="chip" data-days="7">7D</button>
 <button class="chip" data-days="14">14D</button>
 <button class="chip on" data-days="30">30D</button>
 <button class="chip" data-days="90">90D</button>
 <button class="chip" data-days="all">All</button>
 <span class="sep"></span>
 <input type="date" id="from" aria-label="From date"> <span class="lbl">to</span>
 <input type="date" id="to" aria-label="To date">
</div>
<div class="kpis" id="kpis"></div>
<div class="card"><h2>Weight — actual vs plan</h2>
 <div class="leg"><span><i class="sw" style="background:var(--mut)"></i>Daily</span><span><i class="sw" style="background:var(--s1)"></i>7-day avg</span><span><i class="sw dash" style="--c:var(--s1)"></i>Plan</span><span><i class="sw dash"></i>Goal 80 kg</span><span><i class="sw band" style="background:var(--s3)"></i>Refeed week</span></div>
 <div class="wrap"><canvas id="w"></canvas></div></div>
<div class="card"><h2>Est. body fat %</h2>
 <div class="leg"><span><i class="sw" style="background:var(--s1)"></i>Est. BF%</span><span><i class="sw dash" style="--c:var(--s1)"></i>Plan</span><span><i class="sw dash"></i>12% line</span><span><i class="sw band" style="background:var(--s3)"></i>Refeed week</span></div>
 <div class="wrap short"><canvas id="b"></canvas></div>
 <p class="note" id="bfnote"></p></div>
<div class="card"><h2>Calories — intake vs plan</h2>
 <div class="leg"><span><i class="sw" style="background:var(--s1)"></i>Intake</span><span><i class="sw dash" style="--c:var(--s1)"></i>Planned (phase)</span><span><i class="sw band" style="background:var(--s3)"></i>Refeed week</span></div>
 <div class="wrap short"><canvas id="c"></canvas></div></div>
<div class="card"><h2>Macros (grams)</h2>
 <div class="leg"><span><i class="sw" style="background:var(--s1)"></i>Protein</span><span><i class="sw" style="background:var(--s2)"></i>Carbs</span><span><i class="sw" style="background:var(--s3)"></i>Fat</span></div>
 <div class="wrap short"><canvas id="m"></canvas></div></div>
<details><summary>Data table (selected range)</summary><div id="tbl"></div></details>
<script>
const CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vRCuW-WCVlGerVbYM8zqFGkZlumR8n0yK7ukIiggccqE7QY-xRI3cnEuOr5RnXK2IH1X-ktTOWcF_A_/pub?gid=201512278&single=true&output=csv";
const GOAL=80,KCAL_DEFAULT=1850,BF_TARGET=12;
// ——— The plan (phases, planned kcal, weekly weight waypoints) ———
const DT=s=>new Date(s+'T00:00:00');
const PHASES=[
 {n:'Cut 1',   s:DT('2026-07-29'),e:DT('2026-08-20'),k:1950},
 {n:'Refeed 1',s:DT('2026-08-21'),e:DT('2026-08-28'),k:2665,refeed:true},
 {n:'Cut 2',   s:DT('2026-08-29'),e:DT('2026-10-14'),k:1850},
 {n:'Refeed 2',s:DT('2026-10-15'),e:DT('2026-10-22'),k:2560,refeed:true},
 {n:'Cut 3',   s:DT('2026-10-23'),e:DT('2026-11-25'),k:1800},
];
const WP=[['2026-07-29',88.8],['2026-08-05',88.1],['2026-08-12',87.3],['2026-08-19',86.6],
 ['2026-08-28',86.6],['2026-09-02',86.0],['2026-09-09',85.4],['2026-09-16',84.8],
 ['2026-09-23',84.2],['2026-09-30',83.6],['2026-10-07',83.0],['2026-10-14',82.4],
 ['2026-10-22',82.4],['2026-10-28',81.9],['2026-11-04',81.3],['2026-11-11',80.7],
 ['2026-11-18',80.2],['2026-11-25',80.0]].map(([d,w])=>[DT(d),w]);
const PLAN_END=WP[WP.length-1][0];
const phaseOf=d=>PHASES.find(p=>d>=p.s&&d<=p.e)||null;
const planW=d=>{if(d<WP[0][0]||d>PLAN_END)return null;
 for(let i=1;i<WP.length;i++){if(d<=WP[i][0]){const [d0,w0]=WP[i-1],[d1,w1]=WP[i];
  return w0+(w1-w0)*((d-d0)/(d1-d0))}}return null};
// BF% calibrated to measured anchor 2026-08-23: Navy tape (waist 34", neck 15") = 17.5% at 86.3 kg,
// cross-checked by energy-balance ledger (17.4%) → lean mass ≈ 71.2 kg, held constant (strength stable, ~all loss is fat)
const leanAt=w=>71.2;
const bfOf=w=>w!=null?(w-leanAt(w))/w*100:null;
let ALL=[],charts=[],range={mode:'preset',days:30,from:null,to:null};
const $=id=>document.getElementById(id);
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function parseCSV(t){const rows=[];let f='',row=[],q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}else{if(c=='"')q=true;else if(c==',')row.push(f),f='';else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}}if(f!==''||row.length)row.push(f),rows.push(row);return rows}
function num(x){const n=parseFloat((x||'').toString().replace(/[^0-9.\-]/g,''));return isNaN(n)?null:n}
const fmtD=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

async function load(){
 $('err').style.display='none';
 try{
  const r=await fetch(CSV+'&_='+Date.now());if(!r.ok)throw new Error('HTTP '+r.status);
  const rows=parseCSV(await r.text());
  let h=-1;for(let i=0;i<rows.length;i++){const j=rows[i].map(x=>(x||'').toLowerCase().trim());if(j.includes('date')&&j.some(v=>v.startsWith('weight'))){h=i;break}}
  if(h<0)throw new Error('Could not find a header row with Date/Weight. Check the published tab.');
  const H=rows[h].map(x=>(x||'').toLowerCase().trim());
  const col=(...names)=>{for(const n of names){const i=H.findIndex(v=>v===n||v.startsWith(n));if(i>=0)return i}return -1};
  const iD=col('date'),iW=col('weight'),iA=col('7-day avg','7 day avg','7-day','avg'),iK=col('kcal','calories'),iP=col('protein'),iC=col('carbs','carbohydrate'),iF=col('fat'),iT=col('target');
  ALL=[];
  for(let i=h+1;i<rows.length;i++){const rw=rows[i];if(!rw||!rw[iD])continue;
   const d=new Date(rw[iD]);if(isNaN(d))continue;
   // formula-filled future rows read as 0 — treat 0 weight/kcal/macros as not logged
   const z=x=>x===0?null:x;
   ALL.push({d,wt:z(num(rw[iW])),avg:iA>=0?z(num(rw[iA])):null,kc:iK>=0?z(num(rw[iK])):null,
     p:iP>=0?z(num(rw[iP])):null,c:iC>=0?z(num(rw[iC])):null,f:iF>=0?z(num(rw[iF])):null,tgt:iT>=0?z(num(rw[iT])):null})}
  ALL.sort((a,b)=>a.d-b.d);
  // drop trailing pre-filled date rows that have no logged values yet
  const hasData=r=>[r.wt,r.kc,r.p,r.c,r.f].some(x=>x!=null);
  while(ALL.length&&!hasData(ALL[ALL.length-1]))ALL.pop();
  if(!ALL.some(r=>r.avg!=null)){for(let i=0;i<ALL.length;i++){const win=ALL.slice(Math.max(0,i-6),i+1).map(r=>r.wt).filter(x=>x!=null);ALL[i].avg=win.length?win.reduce((a,b)=>a+b,0)/win.length:null}}
  if(!ALL.length)throw new Error('No data rows found.');
  const first=ALL[0].d,last=ALL[ALL.length-1].d;
  const fi=$('from'),ti=$('to');fi.min=ti.min=iso(first);fi.max=ti.max=iso(last);
  applyRange();
  $('stamp').textContent='Live from Google Sheet · updated '+new Date().toLocaleString();
 }catch(e){$('err').textContent='Could not load the sheet: '+e.message;$('err').style.display='block';$('stamp').textContent='Load failed'}
}

function applyRange(){
 if(!ALL.length)return;
 const last=ALL[ALL.length-1].d;let from,to=last;
 if(range.mode==='custom'){from=range.from||ALL[0].d;to=range.to||last}
 else if(range.days==='all'){from=ALL[0].d}
 else{from=new Date(last);from.setDate(from.getDate()-(range.days-1))}
 const sub=ALL.filter(r=>r.d>=from&&r.d<=to);
 $('from').value=iso(sub.length?sub[0].d:from);$('to').value=iso(to);
 render(sub,to.getTime()===last.getTime());
}

$('filters').addEventListener('click',e=>{
 const b=e.target.closest('.chip');if(!b)return;
 document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 range={mode:'preset',days:b.dataset.days==='all'?'all':+b.dataset.days,from:null,to:null};
 applyRange();
});
['from','to'].forEach(id=>$(id).addEventListener('change',()=>{
 document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
 const f=$('from').value?new Date($('from').value+'T00:00:00'):null;
 const t=$('to').value?new Date($('to').value+'T23:59:59'):null;
 range={mode:'custom',from:f,to:t};
 applyRange();
}));

const crosshair={id:'crosshair',afterDatasetsDraw(ch){
 const els=ch.tooltip&&ch.tooltip.getActiveElements();if(!els||!els.length)return;
 const x=els[0].element.x,{top,bottom}=ch.chartArea,ctx=ch.ctx;
 ctx.save();ctx.strokeStyle=cv('--baseline');ctx.lineWidth=1;
 ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();ctx.restore();}};
const hexA=(hex,a)=>{const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`};
const refeedBands={id:'refeedBands',beforeDatasetsDraw(ch){
 const ranges=(ch.options.plugins.refeedBands||{}).ranges||[];if(!ranges.length)return;
 const xs=ch.scales.x,{top,bottom}=ch.chartArea,ctx=ch.ctx;
 const half=ch.data.labels.length>1?(xs.getPixelForValue(1)-xs.getPixelForValue(0))/2:4;
 ctx.save();
 for(const[a,b]of ranges){
  const x0=xs.getPixelForValue(a)-half,x1=xs.getPixelForValue(b)+half;
  ctx.fillStyle=hexA(cv('--s3'),.10);ctx.fillRect(x0,top,x1-x0,bottom-top);
  ctx.fillStyle=cv('--mut');ctx.font='11px system-ui';ctx.textAlign='center';
  ctx.fillText('Refeed',(x0+x1)/2,top+12);}
 ctx.restore();}};

function baseOpts(unit,bands){
 return {responsive:true,maintainAspectRatio:false,animation:false,spanGaps:true,
  interaction:{mode:'index',intersect:false},
  plugins:{legend:{display:false},refeedBands:{ranges:bands||[]},tooltip:{
   backgroundColor:cv('--ink'),titleColor:cv('--page'),bodyColor:cv('--page'),
   padding:10,cornerRadius:8,boxPadding:4,usePointStyle:true,filter:c=>c.parsed.y!=null,
   callbacks:{label:c=>{const v=c.parsed.y;if(v==null)return null;
    const f=unit==='kg'?v.toFixed(1)+' kg':unit==='%'?v.toFixed(1)+' %':Math.round(v)+(unit?' '+unit:'');
    return ' '+c.dataset.label+': '+f}}}},
  scales:{x:{grid:{display:false},border:{color:cv('--baseline')},ticks:{maxRotation:0,autoSkip:true,autoSkipPadding:24,color:cv('--mut')}},
   y:{grid:{color:cv('--grid')},border:{display:false},ticks:{color:cv('--mut'),callback:v=>unit==='kg'?v+' kg':unit==='%'?v+'%':v}}}};
}
function render(sub,atEnd){
 const lastLog=ALL[ALL.length-1].d;
 // future dates through the plan's end; presets cap it at the window size, All/custom-at-end shows the full plan
 let fut=[];
 if(atEnd&&lastLog<PLAN_END){
  const cap=range.mode==='preset'&&range.days!=='all'?range.days:1e9;
  let d=new Date(lastLog);
  while(fut.length<cap){d=new Date(d);d.setDate(d.getDate()+1);if(d>PLAN_END)break;fut.push(d)}
 }
 const n=sub.length,dates=sub.map(r=>r.d).concat(fut),nl=dates.length;
 const L=dates.map(fmtD);
 const padF=arr=>arr.concat(fut.map(()=>null));
 const wt=padF(sub.map(r=>r.wt)),avg=padF(sub.map(r=>r.avg)),kc=padF(sub.map(r=>r.kc)),
  P=padF(sub.map(r=>r.p)),C=padF(sub.map(r=>r.c)),F=padF(sub.map(r=>r.f));
 // plan lines span history AND future — actual vs plan on one timeline
 const planWL=dates.map(d=>{const w=planW(d);return w!=null?+w.toFixed(2):null});
 const planBF=dates.map(d=>{const w=planW(d);return w!=null?+bfOf(w).toFixed(2):null});
 const planK=dates.map(d=>{const p=phaseOf(d);return p?p.k:null});
 const bfAct=padF(sub.map(r=>r.avg!=null?+bfOf(r.avg).toFixed(2):null));
 // refeed bands in combined index space
 const bands=[];let s=-1;
 for(let i=0;i<nl;i++){const p=phaseOf(dates[i]);
  if(p&&p.refeed){if(s<0)s=i}else if(s>=0){bands.push([s,i-1]);s=-1}}
 if(s>=0)bands.push([s,nl-1]);
 // KPIs over selected range
 const wIdx=sub.map((r,i)=>r.wt!=null?i:-1).filter(i=>i>=0);
 const start=wIdx.length?sub[wIdx[0]].wt:null,cur=wIdx.length?sub[wIdx[wIdx.length-1]].wt:null;
 const days=wIdx.length>1?(sub[wIdx[wIdx.length-1]].d-sub[wIdx[0]].d)/864e5:0;
 const lost=start!=null&&cur!=null?start-cur:null;
 const rate=days>0&&lost!=null?lost/days*7:null;
 const kcv=sub.map(r=>r.kc).filter(x=>x!=null),kAvg=kcv.length?kcv.reduce((a,b)=>a+b,0)/kcv.length:null;
 const avAll=ALL.filter(r=>r.avg!=null),lastAvg=avAll.length?avAll[avAll.length-1].avg:null;
 const bfNow=bfOf(lastAvg);
 const curPhase=phaseOf(lastLog);
 const nextRefeed=PHASES.find(p=>p.refeed&&p.e>=lastLog);
 // first plan day at/below 12% BF
 let bf12=null;for(let d=new Date(WP[0][0]);d<=PLAN_END;d.setDate(d.getDate()+1)){const w=planW(d);if(w!=null&&bfOf(w)<=BF_TARGET){bf12=new Date(d);break}}
 const kpi=(l,v,d,g)=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d${g?' g':''}">${d||''}</div></div>`;
 $('kpis').innerHTML=
  kpi('Current',cur!=null?cur.toFixed(1)+' kg':'—',wIdx.length?fmtD(sub[wIdx[wIdx.length-1]].d):'')+
  kpi('Phase',curPhase?curPhase.n:'—',curPhase?'plan '+curPhase.k+' kcal · ends '+fmtD(curPhase.e):'')+
  kpi('Lost in range',lost!=null?lost.toFixed(1)+' kg':'—',rate!=null?rate.toFixed(2)+' kg/wk':'',lost>0)+
  kpi('Avg intake',kAvg!=null?Math.round(kAvg)+' kcal':'—','over '+kcv.length+' logged days')+
  kpi('Est. body fat','~'+(bfNow!=null?bfNow.toFixed(1):'—')+'%',bf12?'12% est. '+fmtD(bf12):'')+
  kpi('To goal',cur!=null?(cur-GOAL).toFixed(1)+' kg':'—','plan: '+fmtD(PLAN_END))+
  kpi('Next refeed',nextRefeed?fmtD(nextRefeed.s)+' – '+fmtD(nextRefeed.e):'done',nextRefeed?nextRefeed.k+' kcal/day':'');
 $('bfnote').textContent='Calibrated to measured anchor (Aug 23: tape 34"/15" → Navy 17.5% at 86.3 kg, matching the energy-balance ledger) assuming ~71 kg lean mass held constant — supported by stable lifts. Milestones: 15% ≈ 83.8 kg · 12% ≈ 80.9 kg · 10% ≈ 79.1 kg. Re-tape ~Sep 2 post-refeed to tighten.';
 charts.forEach(c=>c.destroy());charts=[];
 Chart.defaults.font.family='system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
 Chart.defaults.font.size=12;
 const dash={borderDash:[5,4],pointRadius:0,pointHoverRadius:4,tension:.2,borderWidth:2};
 charts.push(new Chart($('w'),{type:'line',plugins:[refeedBands,crosshair],data:{labels:L,datasets:[
  {label:'Daily',data:wt,borderColor:cv('--mut'),borderWidth:1.5,pointRadius:1.5,pointHoverRadius:4,tension:.2},
  {label:'7-day avg',data:avg,borderColor:cv('--s1'),borderWidth:2.5,pointRadius:0,pointHoverRadius:4,tension:.3},
  {label:'Plan',data:planWL,borderColor:cv('--s1'),...dash},
  {label:'Goal',data:L.map(()=>GOAL),borderColor:cv('--baseline'),borderDash:[5,4],borderWidth:1.5,pointRadius:0,pointHoverRadius:0}]},
  options:baseOpts('kg',bands)}));
 charts.push(new Chart($('b'),{type:'line',plugins:[refeedBands,crosshair],data:{labels:L,datasets:[
  {label:'Est. BF',data:bfAct,borderColor:cv('--s1'),borderWidth:2.5,pointRadius:0,pointHoverRadius:4,tension:.3},
  {label:'Plan',data:planBF,borderColor:cv('--s1'),...dash},
  {label:'12% line',data:L.map(()=>BF_TARGET),borderColor:cv('--baseline'),borderDash:[5,4],borderWidth:1.5,pointRadius:0,pointHoverRadius:0}]},
  options:baseOpts('%',bands)}));
 charts.push(new Chart($('c'),{type:'line',plugins:[refeedBands,crosshair],data:{labels:L,datasets:[
  {label:'Intake',data:kc,borderColor:cv('--s1'),borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:.2},
  {label:'Planned',data:planK,borderColor:cv('--s1'),borderDash:[5,4],borderWidth:2,pointRadius:0,pointHoverRadius:4,stepped:true}]},
  options:baseOpts('kcal',bands)}));
 charts.push(new Chart($('m'),{type:'line',plugins:[crosshair],data:{labels:sub.map(r=>fmtD(r.d)),datasets:[
  {label:'Protein',data:sub.map(r=>r.p),borderColor:cv('--s1'),borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:.2},
  {label:'Carbs',data:sub.map(r=>r.c),borderColor:cv('--s2'),borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:.2},
  {label:'Fat',data:sub.map(r=>r.f),borderColor:cv('--s3'),borderWidth:2,pointRadius:0,pointHoverRadius:4,tension:.2}]},
  options:baseOpts('g')}));
 // table cells use textContent — sheet values are untrusted
 const tbl=$('tbl');tbl.replaceChildren();
 const t=document.createElement('table'),tr=document.createElement('tr');
 ['Date','Phase','Weight (kg)','7-day avg','Plan wt','Est. BF %','kcal','Plan kcal','Protein (g)','Carbs (g)','Fat (g)'].forEach(h=>{const th=document.createElement('th');th.textContent=h;tr.appendChild(th)});
 t.appendChild(tr);
 sub.forEach(r=>{const row=document.createElement('tr');
  const bf=r.avg!=null?bfOf(r.avg):null,pw=planW(r.d),ph=phaseOf(r.d);
  [fmtD(r.d),ph?ph.n:'—',r.wt!=null?r.wt.toFixed(1):'—',r.avg!=null?r.avg.toFixed(1):'—',pw!=null?pw.toFixed(1):'—',bf!=null?bf.toFixed(1):'—',
   r.kc!=null?String(Math.round(r.kc)):'—',ph?String(ph.k):'—',r.p!=null?String(Math.round(r.p)):'—',r.c!=null?String(Math.round(r.c)):'—',r.f!=null?String(Math.round(r.f)):'—']
  .forEach(v=>{const td=document.createElement('td');td.textContent=v;row.appendChild(td)});
  t.appendChild(row)});
 tbl.appendChild(t);
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyRange());
setInterval(load,300000);
load();
</script></body></html>
